[project]
name = "skillagent"
version = "0.1.0"
description = "CLI prototype of a multi-skill LLM agent (LangGraph router + 4 skills, English/Persian)."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.24",
    "openai>=3.59.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
    "typer>=0.29.2",
]

[project.scripts]
skillagent = "skillagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skillagent"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".worktrees", "*.md"]  # docs and prompt files are not Python

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live' --import-mode=importlib"
markers = [
    "live: makes real calls to an LLM provider (costs free-tier quota; skipped by default)",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
